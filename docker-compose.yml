services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: widgetforge
      POSTGRES_USER: widget
      POSTGRES_PASSWORD: widget
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U widget -d widgetforge"]
      interval: 5s
      timeout: 3s
      retries: 10
    volumes:
      - postgres_data:/var/lib/postgresql/data

  api:
    build: .
    env_file: .env
    environment:
      DATABASE_URL: postgresql+psycopg2://widget:widget@db:5432/widgetforge
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy

volumes:
  postgres_data:
